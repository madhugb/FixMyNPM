version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: fixmynpm
    main: ./main.go
    binary: fixmynpm
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/madhugb/fixmynpm/cmd.version={{.Version}}

archives:
  - id: fixmynpm
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: ["zip"]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: madhugb
    name: FixMyNPM
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
